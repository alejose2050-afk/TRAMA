# Servicios de TRAMA - Entorno de desarrollo
# Base de datos PostgreSQL y backend Django

services:

  # --- Base de datos ---
  db:
    image: postgres:17
    container_name: trama-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trama
      POSTGRES_USER: trama_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trama_user -d trama" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Backend Django ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trama-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=trama
      - DB_USER=trama_user
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

services:
  db:
    image: postgres:17
    container_name: trama-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trama
      POSTGRES_USER: trama_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trama_user -d trama" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
